name: Record

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Сценарий съёмки"
        required: false
        default: "smoke"

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Download reading fonts
        run: |
          mkdir -p app/src/main/assets/fonts
          grep -v '^#' app/fonts.txt | while read -r name path; do
            [ -z "$name" ] && continue
            url="https://github.com/google/fonts/raw/main/$(echo "$path" | sed 's/\[/%5B/g; s/\]/%5D/g')"
            curl -fsSL --retry 3 -o "app/src/main/assets/fonts/$name" "$url" || rm -f "app/src/main/assets/fonts/$name"
          done

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > app/release.keystore

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease -Puniversal=true --stacktrace

      - name: Demo books
        run: |
          mkdir -p demo
          curl -fsSL --retry 3 -o demo/book1.epub "https://www.gutenberg.org/ebooks/2554.epub3.images" || true
          curl -fsSL --retry 3 -o demo/book2.epub "https://www.gutenberg.org/ebooks/1342.epub3.images" || true
          ls -la demo

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Record on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          cores: 4
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash tools/record/run.sh "${{ inputs.scenario }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: footage
          path: footage/
          retention-days: 7
