name: Record

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Сценарий съёмки"
        required: false
        default: "smoke"

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Download reading fonts
        run: |
          mkdir -p app/src/main/assets/fonts
          grep -v '^#' app/fonts.txt | while read -r name path; do
            [ -z "$name" ] && continue
            url="https://github.com/google/fonts/raw/main/$(echo "$path" | sed 's/\[/%5B/g; s/\]/%5D/g')"
            curl -fsSL --retry 3 -o "app/src/main/assets/fonts/$name" "$url" || rm -f "app/src/main/assets/fonts/$name"
          done

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > app/release.keystore

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease -Puniversal=true --stacktrace

      - name: Demo books
        run: |
          mkdir -p demo
          python3 tools/record/makebook.py demo/dorogi.epub "Северные дороги" 1
          python3 tools/record/makebook.py demo/bereg.epub "Дальний берег" 2
          python3 tools/record/makebook.py demo/zima.epub "Тихая зима" 3
          ls -la demo

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Record on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 900
          ram-size: 4096M
          cores: 4
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -skin 720x1600
          script: bash tools/record/run.sh "${{ inputs.scenario }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: footage
          path: footage/
          retention-days: 7

      - name: Hand over footage
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d footage ] || exit 0
          zip -qr footage.zip footage
          T="footage-${{ github.run_number }}"
          gh release create "$T" footage.zip --draft --title "$T" --notes "" --target "${{ github.sha }}"
          gh api "repos/${{ github.repository }}/releases?per_page=50" -q '.[] | select(.draft and (.tag_name | startswith("footage-"))) | .tag_name' | sort -t- -k2 -n | head -n -3 | while read -r old; do
            gh release delete "$old" -y || true
          done
