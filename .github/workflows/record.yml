name: Record

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Сценарий съёмки"
        required: false
        default: "smoke"

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Download reading fonts
        run: |
          mkdir -p app/src/main/assets/fonts
          grep -v '^#' app/fonts.txt | while read -r name path; do
            [ -z "$name" ] && continue
            url="https://github.com/google/fonts/raw/main/$(echo "$path" | sed 's/\[/%5B/g; s/\]/%5D/g')"
            curl -fsSL --retry 3 -o "app/src/main/assets/fonts/$name" "$url" || rm -f "app/src/main/assets/fonts/$name"
          done

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > app/release.keystore

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease -Puniversal=true --stacktrace

      - name: Demo books
        timeout-minutes: 5
        run: |
          mkdir -p demo
          get() { curl -fsSL --retry 2 --connect-timeout 15 --max-time 90 -o "$1" "$2" && [ -s "$1" ] || rm -f "$1"; }
          get demo/kapitanskaya.epub "https://ws-export.wmcloud.org/?lang=ru&title=%D0%9A%D0%B0%D0%BF%D0%B8%D1%82%D0%B0%D0%BD%D1%81%D0%BA%D0%B0%D1%8F_%D0%B4%D0%BE%D1%87%D0%BA%D0%B0_(%D0%9F%D1%83%D1%88%D0%BA%D0%B8%D0%BD)&format=epub"
          get demo/pride.epub "https://www.gutenberg.org/cache/epub/1342/pg1342-images-3.epub"
          get demo/crime.epub "https://www.gutenberg.org/cache/epub/2554/pg2554-images-3.epub"
          ls -la demo

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Record on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          cores: 4
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash tools/record/run.sh "${{ inputs.scenario }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: footage
          path: footage/
          retention-days: 7
