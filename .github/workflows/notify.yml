name: Notify

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      text:
        description: Текст
        required: false

permissions:
  contents: write

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send
        env:
          KEY: ${{ secrets.SELECTEL_S3_ACCESS }}
          SECRET: ${{ secrets.SELECTEL_S3_SECRET }}
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TEXT: ${{ inputs.text }}
        run: |
          base=https://wikiflerty-books.s3.ru-3.storage.selcloud.ru
          s3() { curl -sS --fail --max-time 30 --aws-sigv4 "aws:amz:ru-3:s3" --user "$KEY:$SECRET" -H "x-amz-content-sha256: UNSIGNED-PAYLOAD" "$@"; }
          if [ -n "$TEXT" ]; then printf '%s' "$TEXT" > in.txt; s3 -X PUT --data-binary @in.txt "$base/notify/$(date +%s%N)-manual.txt"; fi
          keys=$(s3 "$base/?list-type=2&prefix=notify/" | grep -o '<Key>[^<]*' | sed 's/<Key>//' | sort)
          [ -n "$keys" ] || { echo "nothing"; exit 0; }
          kid=$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" -q '.[] | select(.tag_name=="film-kit") | .assets[0].id' | head -1)
          gh api -H "Accept: application/octet-stream" "repos/${{ github.repository }}/releases/assets/$kid" > kit.zip
          unzip -oq kit.zip chat.txt -d tg
          owner=$(cat tg/chat.txt)
          for k in $keys; do
            s3 -o msg.txt "$base/$k"
            code=$(curl -sS -o /dev/null -w '%{http_code}' --data-urlencode "chat_id=$owner" --data-urlencode "text@msg.txt" "https://api.telegram.org/bot$BOT/sendMessage")
            echo "$k $code"
            if [ "$code" = 200 ]; then s3 -X DELETE "$base/$k" -o /dev/null; fi
          done
