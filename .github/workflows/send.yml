name: Send

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "черновой релиз с видео и caption.txt"
        required: true

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Telegram
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          mkdir -p audio out
          kid=$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" -q '.[] | select(.tag_name=="film-kit") | .assets[0].id' | head -1 || true)
          if [ -n "$kid" ]; then gh api -H "Accept: application/octet-stream" "repos/${{ github.repository }}/releases/assets/$kid" > kit.zip && unzip -oq kit.zip -d audio; fi
          gh release download "${{ inputs.tag }}" -D out --repo "${{ github.repository }}"
          ls -la out
          for v in out/*.mp4; do python3 tools/film/tg.py audio/chat.txt "$v" out/caption.txt; done
