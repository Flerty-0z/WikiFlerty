name: Film

on:
  workflow_dispatch:
    inputs:
      scene:
        description: Сценарий
        default: overview
      device:
        description: "model,version или пусто"
        default: ""
      form:
        description: PHYSICAL или VIRTUAL
        default: PHYSICAL

permissions:
  contents: write

jobs:
  film:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Studio content
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/studio/content.sh "${{ github.repository }}"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > app/release.keystore

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assembleStudio assembleStudioAndroidTest -Puniversal --stacktrace 2>&1 | tee build.log
          find app/build/outputs/apk -name "*.apk" | sort

      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|ERROR:|What went wrong" -A3 build.log | head -60 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line}"
          done

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SA_JSON }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Shoot
        id: shoot
        env:
          SCENE: ${{ inputs.scene }}
          DEVICE: ${{ inputs.device }}
          FORM: ${{ inputs.form }}
        run: |
          APP=$(find app/build/outputs/apk/studio -name "*universal*.apk" | head -1)
          [ -z "$APP" ] && APP=$(find app/build/outputs/apk/studio -name "*.apk" | head -1)
          TEST=$(find app/build/outputs/apk/androidTest -name "*.apk" | head -1)
          echo "app=$APP test=$TEST"
          gcloud firebase test android models list --format=json > models.json
          if [ -z "$DEVICE" ]; then
            DEVICE=$(python3 tools/film/pick.py models.json "$FORM")
          fi
          echo "device=$DEVICE"
          M=${DEVICE%%,*}; V=${DEVICE##*,}
          set +e
          gcloud firebase test android run \
            --type instrumentation \
            --app "$APP" --test "$TEST" \
            --device "model=$M,version=$V,locale=ru,orientation=portrait" \
            --environment-variables "scene=$SCENE" \
            --directories-to-pull /sdcard/wf \
            --results-dir "film-${{ github.run_number }}" \
            --timeout 25m \
            --record-video \
            --no-performance-metrics 2>&1 | tee run.log
          code=${PIPESTATUS[0]}
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          BUCKET=$(grep -oE "test-lab-[a-z0-9-]+" run.log | head -1)
          echo "bucket=$BUCKET"
          mkdir -p results
          gsutil -m -q cp -r "gs://$BUCKET/film-${{ github.run_number }}" results/ || true
          find results -type f | sed 's/^/  /'

      - name: Report
        if: always()
        run: |
          for f in $(find results -name film.log) $(find results -name screen.txt); do echo "=== $f"; cat "$f"; done
          for f in $(find results -name marks.json); do echo "=== $f"; python3 tools/film/summary.py "$f"; done
          for f in $(find results -name "logcat*"); do echo "=== $f"; grep -E "WFStudio|FATAL|AndroidRuntime" "$f" | head -150; done

      - name: Hand over
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d results ] || exit 0
          (cd results && zip -qr ../film.zip .)
          ls -la film.zip
          gh release delete film --cleanup-tag -y --repo "${{ github.repository }}" 2>/dev/null || true
          gh release create film film.zip --draft --title "Film ${{ github.run_number }}" --notes "" --target "${{ github.sha }}" --repo "${{ github.repository }}"

      - name: Verdict
        if: steps.shoot.outputs.code != '0'
        run: exit 1
