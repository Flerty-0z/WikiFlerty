name: Film

on:
  workflow_dispatch:
    inputs:
      scene:
        description: Сценарий
        default: overview
      device:
        description: "model,version или пусто"
        default: ""
      form:
        description: PHYSICAL или VIRTUAL
        default: PHYSICAL
      plan:
        description: "Монтаж: tools/film/plans/<имя>.json или пусто"
        default: ""
      reuse:
        description: "Монтировать прошлую съёмку без новой"
        type: boolean
        default: false
      source:
        description: "Взять съёмку из облака: film-N"
        default: ""
      send:
        description: "Отправить в Telegram"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  film:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Studio content
        if: ${{ !inputs.reuse }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/studio/content.sh "${{ github.repository }}"

      - name: Signing key
        if: ${{ !inputs.reuse }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > app/release.keystore

      - name: Offline speech engine
        if: ${{ !inputs.reuse }}
        run: |
          curl -fsSL --retry 3 -o sherpa.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-android.tar.bz2" \
            && mkdir -p sherpa && tar xjf sherpa.tar.bz2 -C sherpa \
            && for abi in arm64-v8a armeabi-v7a x86_64; do \
                 d="$(dirname "$(find sherpa -path "*$abi/libsherpa-onnx-jni.so" | head -1)")"; \
                 [ -f "$d/libsherpa-onnx-jni.so" ] && mkdir -p "app/src/main/jniLibs/$abi" && cp "$d/libsherpa-onnx-jni.so" "$d/libonnxruntime.so" "app/src/main/jniLibs/$abi/"; \
               done; rm -rf sherpa sherpa.tar.bz2; ls -la app/src/main/jniLibs/* || true

      - name: Build
        if: ${{ !inputs.reuse }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VDS_HOST: ${{ secrets.VDS_HOST }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleStudio -Puniversal :filmer:assembleDebug :filmer:assembleDebugAndroidTest --stacktrace 2>&1 | tee build.log
          find app/build/outputs/apk -name "*.apk" | sort

      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|ERROR:|What went wrong" -A3 build.log | head -60 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line}"
          done

      - uses: google-github-actions/auth@v2
        if: ${{ !inputs.reuse || inputs.source != '' }}
        with:
          credentials_json: ${{ secrets.FIREBASE_SA_JSON }}

      - uses: google-github-actions/setup-gcloud@v2
        if: ${{ !inputs.reuse || inputs.source != '' }}

      - name: Previous footage
        if: ${{ inputs.reuse }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results
          if [ -n "${{ inputs.source }}" ]; then
            gsutil -m -q cp -r "gs://test-lab-asyqad4a514ax-jxj2zb2wsjj30/${{ inputs.source }}" results/
          else
            id=$(gh api "repos/${{ github.repository }}/releases?per_page=100" -q '[.[] | select(.tag_name=="film")][0].assets[] | select(.name=="film.zip") | .id')
            gh api -H "Accept: application/octet-stream" "repos/${{ github.repository }}/releases/assets/$id" > prev.zip
            unzip -oq prev.zip -d results
          fi
          find results -name "*.mp4" | head

      - name: Shoot
        id: shoot
        if: ${{ !inputs.reuse }}
        env:
          SCENE: ${{ inputs.scene }}
          DEVICE: ${{ inputs.device }}
          FORM: ${{ inputs.form }}
        run: |
          APP=$(find app/build/outputs/apk/studio -name "*universal*.apk" | head -1)
          [ -z "$APP" ] && APP=$(find app/build/outputs/apk/studio -name "*.apk" | head -1)
          FILMER=$(find filmer/build/outputs/apk/debug -name "*.apk" | head -1)
          TEST=$(find filmer/build/outputs/apk/androidTest -name "*.apk" | head -1)
          echo "app=$APP filmer=$FILMER test=$TEST"
          gcloud firebase test android models list --format=json > models.json
          if [ -z "$DEVICE" ]; then
            DEVICE=$(python3 tools/film/pick.py models.json "$FORM")
          fi
          echo "device=$DEVICE"
          M=${DEVICE%%,*}; V=${DEVICE##*,}
          set +e
          gcloud firebase test android run \
            --type instrumentation \
            --app "$FILMER" --test "$TEST" \
            --additional-apks "$APP" \
            --device "model=$M,version=$V,locale=ru,orientation=portrait" \
            --environment-variables "scene=$SCENE" \
            --directories-to-pull /data/local/tmp/wf \
            --results-dir "film-${{ github.run_number }}" \
            --timeout 25m \
            --no-record-video \
            --no-performance-metrics 2>&1 | tee run.log
          code=${PIPESTATUS[0]}
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          BUCKET=$(grep -oE "test-lab-[a-z0-9-]+" run.log | head -1)
          echo "bucket=$BUCKET"
          mkdir -p results
          gsutil -m -q cp -r "gs://$BUCKET/film-${{ github.run_number }}" results/ || true
          find results -type f | sed 's/^/  /'

      - name: Report
        if: always()
        run: |
          for f in $(find results -name film.log) $(find results -name screen.txt); do echo "=== $f"; cat "$f"; done
          for f in $(find results -name marks.json); do echo "=== $f"; python3 tools/film/summary.py "$f"; done
          for f in $(find results -name "logcat*"); do echo "=== $f"; grep -E "WFStudio|FATAL|AndroidRuntime" "$f" | head -2000; done

      - name: Hand over
        if: ${{ always() && (!inputs.reuse || inputs.source != '') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d results ] || exit 0
          (cd results && zip -qr ../film.zip . -x "*_cfr.mp4" "*raw.mp4")
          ls -la film.zip
          for i in 1 2 3; do
            gh release delete film --cleanup-tag -y --repo "${{ github.repository }}" 2>/dev/null || true
            sleep 3
            gh release create film film.zip --draft --title "Film ${{ github.run_number }}" --notes "" --repo "${{ github.repository }}" && break
            sleep 10
          done

      - name: Montage
        id: montage
        if: ${{ inputs.plan != '' && (inputs.reuse || steps.shoot.outcome == 'success') }}
        env:
          GH_TOKEN: ${{ github.token }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PLAN: ${{ inputs.plan }}
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null)
          pip install --quiet --break-system-packages numpy pillow || pip install --quiet numpy pillow
          mkdir -p audio fonts out
          kid=$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" -q \'.[] | select(.tag_name=="film-kit") | .assets[0].id\' | head -1 || true)
          if [ -n "$kid" ]; then gh api -H "Accept: application/octet-stream" "repos/${{ github.repository }}/releases/assets/$kid" > kit.zip && unzip -oq kit.zip -d audio; fi
          curl -fsSL --retry 3 -o fonts/JetBrainsMono.ttf "https://github.com/google/fonts/raw/main/ofl/jetbrainsmono/JetBrainsMono%5Bwght%5D.ttf"
          curl -fsSL --retry 3 -o fonts/Title.ttf "https://github.com/google/fonts/raw/main/ofl/robotocondensed/RobotoCondensed%5Bwght%5D.ttf"
          curl -fsSL --retry 3 -o fonts/Kicker.ttf "https://github.com/google/fonts/raw/main/ofl/lora/Lora-Italic%5Bwght%5D.ttf"
          NAME=$(basename "$PLAN" .json)
          if python3 -c "import json,sys; sys.exit(0 if 'beats' in json.load(open(sys.argv[1])) else 1)" "$PLAN"; then
            python3 tools/film/beats_voice.py "$PLAN" audio
            python3 tools/film/sfx.py audio
            python3 tools/film/reel.py --results results --plan "$PLAN" --audio audio --fonts fonts --out "out/$NAME.mp4" --stills stills
            (cd stills && zip -q ../out/stills.zip *.jpg)
          else
            python3 tools/film/voice.py "$PLAN" audio
            python3 tools/film/edit.py --results results --plan "$PLAN" --audio audio --fonts fonts --out "out/$NAME.mp4"
          fi
          size=$(stat -c %s "out/$NAME.mp4")
          if [ "$size" -gt 48000000 ]; then
            ffmpeg -v error -y -i "out/$NAME.mp4" -c:v libx264 -crf 23 -preset medium -c:a copy -movflags +faststart "out/$NAME.small.mp4" && mv "out/$NAME.small.mp4" "out/$NAME.mp4"
          fi
          ls -la out
          python3 -c "import json,sys; p=json.load(open(sys.argv[1])); open('caption.txt','w').write(p.get('caption',''))" "$PLAN"
          gh release delete film-video --cleanup-tag -y --repo "${{ github.repository }}" 2>/dev/null || true
          gh release create film-video out/*.mp4 $(ls out/*.zip 2>/dev/null) --draft --title "Video ${{ github.run_number }}" --notes "" --repo "${{ github.repository }}"

      - name: Telegram
        if: ${{ steps.montage.outcome == 'success' && inputs.send }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] || { echo "no bot"; exit 0; }
          python3 tools/film/tg.py audio/chat.txt out/*.mp4 caption.txt

      - name: Save kit
        if: ${{ always() && steps.montage.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f kit.zip
          (cd audio && zip -q ../kit.zip sfx_*.mp3 music.mp3 chat.txt voice_*.mp3 2>/dev/null) || true
          [ -f kit.zip ] || exit 0
          gh release delete film-kit --cleanup-tag -y --repo "${{ github.repository }}" 2>/dev/null || true
          gh release create film-kit kit.zip --draft --title film-kit --notes "" --repo "${{ github.repository }}"

      - name: Verdict
        if: ${{ !inputs.reuse && steps.shoot.outputs.code != '0' }}
        run: exit 1
