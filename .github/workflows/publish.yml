name: Publish for everyone

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Build the next version for everyone
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          LAST=$(gh api "repos/$REPO/releases/latest" -q .tag_name)
          NEXT=$(( ${LAST##*.} + 1 ))
          gh workflow run build.yml --repo "$REPO" --ref main -f public="$NEXT"
          echo "Собирается v0.1.$NEXT для всех"
