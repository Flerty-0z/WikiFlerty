name: Announce

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия, например 0.1.269"
        required: true
      wait:
        description: "Сколько минут ждать пост в канале"
        default: "180"

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          REPO: ${{ github.repository }}
          WAIT_MINUTES: ${{ inputs.wait }}
        run: |
          mkdir -p tg
          kid=$(gh api --paginate "repos/$REPO/releases?per_page=100" -q '.[] | select(.tag_name=="film-kit") | .assets[0].id' | head -1)
          echo "kid=$kid"
          gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$kid" > kit.zip
          unzip -oq kit.zip chat.txt -d tg
          mkdir -p apk
          for id in $(gh api "repos/$REPO/releases/tags/v${{ inputs.version }}" -q '.assets[] | select(.name | endswith(".apk")) | .id' 2>/dev/null || true); do
            name=$(gh api "repos/$REPO/releases/assets/$id" -q .name)
            gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$id" > "apk/$name"
          done
          ls -la apk
          python3 tools/release/announce.py tg/chat.txt "${{ inputs.version }}" tools/release/announce.txt apk
