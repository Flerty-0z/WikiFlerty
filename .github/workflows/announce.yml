name: Announce

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия, например 0.1.269"
        required: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p tg
          kid=$(gh api "repos/$REPO/releases?per_page=100" -q '[.[] | select(.tag_name=="film-kit")][0].assets[0].id')
          gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$kid" > kit.zip
          unzip -oq kit.zip chat.txt -d tg
          python3 tools/release/announce.py tg/chat.txt "${{ inputs.version }}" tools/release/announce.txt
