name: Torture

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/src/main/java/com/flerty/wikiflerty/data/**', 'app/src/test/**', '.github/workflows/torture.yml']

concurrency:
  group: torture
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Converters on hard files
        run: set -o pipefail; ./gradlew :app:testDebugUnitTest --tests '*TortureTest*' --stacktrace 2>&1 | tee test.log
      - if: always()
        run: grep -E "torture |FAILED|PASSED|Error" test.log | head -60 || true
