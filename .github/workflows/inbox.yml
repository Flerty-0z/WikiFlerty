name: Inbox

on:
  workflow_dispatch:
    inputs:
      probe:
        type: boolean
        default: false
      attach:
        description: "chat message version"
        default: ""

permissions:
  contents: write

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Owner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kid=$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" -q \'.[] | select(.tag_name=="film-kit") | .assets[0].id\' | head -1)
          gh api -H "Accept: application/octet-stream" "repos/${{ github.repository }}/releases/assets/$kid" > kit.zip
          unzip -oq kit.zip chat.txt -d tg
          echo "OWNER=$(cat tg/chat.txt)" >> "$GITHUB_ENV"
      - name: Read
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -n "${{ inputs.attach }}" ]; then python3 tools/release/buttons.py ${{ inputs.attach }}; elif [ "${{ inputs.probe }}" = "true" ]; then python3 tools/release/probe.py; else python3 tools/release/inbox.py; fi
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.probe }}
        with:
          name: catalog
          path: catalog.json
