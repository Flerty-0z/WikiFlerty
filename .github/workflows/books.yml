name: Demo books

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  books:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build library
        run: |
          pip install --quiet pillow
          mkdir -p fonts
          curl -fsSL --retry 3 -o fonts/Oswald.ttf "https://github.com/google/fonts/raw/main/ofl/oswald/Oswald%5Bwght%5D.ttf"
          curl -fsSL --retry 3 -o fonts/Playfair.ttf "https://github.com/google/fonts/raw/main/ofl/playfairdisplay/PlayfairDisplay%5Bwght%5D.ttf"
          python3 tools/record/library.py library fonts
          ls -la library

      - name: Hand over
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -qrj library.zip library
          gh release delete demo-library --cleanup-tag -y --repo "${{ github.repository }}" 2>/dev/null || true
          gh release create demo-library library.zip --draft --title demo-library --notes "" --repo "${{ github.repository }}"
