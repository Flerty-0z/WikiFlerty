name: Check
on:
  push:
    branches: [check]
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile
        run: |
          set -o pipefail
          ./gradlew :app:compileReleaseKotlin --stacktrace 2>&1 | tee build.log
      - name: Errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A3 build.log | head -80
