name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Reading fonts (SIL Open Font License) are downloaded at build time
      # from the Google Fonts repository instead of being stored in git.
      - name: Download reading fonts
        run: |
          mkdir -p app/src/main/assets/fonts
          cd app/src/main/assets/fonts
          base=https://github.com/google/fonts/raw/main/ofl
          get() { curl -fsSL --retry 3 -o "$1" "$2" || { echo "::warning::Font not downloaded: $1"; rm -f "$1"; }; }
          get Literata.ttf          "$base/literata/Literata%5Bopsz,wght%5D.ttf"
          get Literata-Italic.ttf   "$base/literata/Literata-Italic%5Bopsz,wght%5D.ttf"
          get PTSerif-Regular.ttf   "$base/ptserif/PT_Serif-Web-Regular.ttf"
          get PTSerif-Bold.ttf      "$base/ptserif/PT_Serif-Web-Bold.ttf"
          get PTSerif-Italic.ttf    "$base/ptserif/PT_Serif-Web-Italic.ttf"
          ls -la

      - name: Build
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A3 build.log | head -60 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line}"
          done

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/WikiFlerty-0.1.${{ github.run_number }}.apk"

      - name: Publish release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.${{ github.run_number }}" out/*.apk \
            --title "WikiFlerty 0.1.${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=%B)" \
            --target "${{ github.sha }}"
