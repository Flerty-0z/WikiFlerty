name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      public:
        description: "Номер версии для всех пользователей. Пусто — тестовая сборка"
        required: false
        default: ""
      store:
        description: "Одна общая APK для RuStore, без релиза"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}-${{ inputs.public || 'test' }}-${{ inputs.store && 'store' || 'gh' }}
  cancel-in-progress: ${{ !inputs.public }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Download reading fonts
        run: |
          mkdir -p app/src/main/assets/fonts
          grep -v '^#' app/fonts.txt | while read -r name path; do
            [ -z "$name" ] && continue
            url="https://github.com/google/fonts/raw/main/$(echo "$path" | sed 's/\[/%5B/g; s/\]/%5D/g')"
            curl -fsSL --retry 3 -o "app/src/main/assets/fonts/$name" "$url" \
              || { echo "::warning::Font not downloaded: $name"; rm -f "app/src/main/assets/fonts/$name"; }
          done
          ls app/src/main/assets/fonts | wc -l

      - name: Offline speech engine
        run: |
          curl -fsSL --retry 3 -o sherpa.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-android.tar.bz2" \
            && mkdir -p sherpa && tar xjf sherpa.tar.bz2 -C sherpa \
            && for abi in arm64-v8a armeabi-v7a; do \
                 mkdir -p "app/src/main/jniLibs/$abi" \
                 && d="$(dirname "$(find sherpa -path "*$abi/libsherpa-onnx-jni.so" | head -1)")" \
                 && cp "$d/libsherpa-onnx-jni.so" "$d/libonnxruntime.so" "app/src/main/jniLibs/$abi/" || echo "::warning::$abi speech libs missing"; \
               done \
            && ls -la app/src/main/jniLibs/* \
            || echo "::warning::Offline speech engine not downloaded"
          rm -rf sherpa sherpa.tar.bz2

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets in Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > app/release.keystore

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PUBLIC_VERSION: ${{ inputs.public }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease ${{ inputs.store && '-Puniversal=true' || '' }} --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|ERROR:|Missing class|What went wrong" -A3 build.log | head -60 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line}"
          done

      - name: Store APK
        if: ${{ inputs.store }}
        run: |
          mkdir -p store
          cp app/build/outputs/apk/release/app-universal-release.apk "store/WikiFlerty-0.1.${{ inputs.public || github.run_number }}.apk"

      - name: Store draft
        if: ${{ inputs.store }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="store-0.1.${{ inputs.public || github.run_number }}"
          gh release delete "$T" --cleanup-tag -y 2>/dev/null || true
          gh release create "$T" store/*.apk --draft --title "$T" --notes "" --target "${{ github.sha }}"

      - name: Rename APK
        if: ${{ !inputs.store }}
        run: |
          N="${{ inputs.public || github.run_number }}"
          mkdir -p out
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "out/WikiFlerty-0.1.$N-x64.apk"
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk "out/WikiFlerty-0.1.$N-x32.apk"

      - name: Publish release with the APK
        if: ${{ !inputs.store }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC: ${{ inputs.public }}
        run: |
          if [ -n "$PUBLIC" ]; then
            N="$PUBLIC"
            if gh release view "v0.1.$N" --json isPrerelease -q .isPrerelease 2>/dev/null | grep -q true; then
              gh release delete "v0.1.$N" --cleanup-tag -y
            fi
            gh release create "v0.1.$N" "out/WikiFlerty-0.1.$N-x64.apk" "out/WikiFlerty-0.1.$N-x32.apk" \
              --title "WikiFlerty 0.1.$N" \
              --notes "" \
              --latest \
              --target "${{ github.sha }}"
          else
            N="${{ github.run_number }}"
            gh release create "v0.1.$N" "out/WikiFlerty-0.1.$N-x64.apk" "out/WikiFlerty-0.1.$N-x32.apk" \
              --title "WikiFlerty 0.1.$N · тест" \
              --notes "" \
              --prerelease \
              --latest=false \
              --target "${{ github.sha }}"
          fi
