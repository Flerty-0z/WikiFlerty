name: probe
on:
  push:
    branches: [probe]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          ls $ANDROID_HOME/platforms
          J=$(ls -d $ANDROID_HOME/platforms/android-3[5-9]* | tail -1)/android.jar
          echo $J
          for c in android.graphics.pdf.PdfRenderer\$Page android.graphics.pdf.models.selection.SelectionBoundary android.graphics.pdf.models.selection.PageSelection android.graphics.pdf.content.PdfPageTextContent android.graphics.pdf.models.PageMatchBounds android.graphics.pdf.content.PdfPageGotoLinkContent android.graphics.pdf.content.PdfPageGotoLinkContent\$Destination android.graphics.pdf.content.PdfPageLinkContent android.graphics.pdf.PdfRendererPreV\$Page android.graphics.pdf.PdfRendererPreV; do javap -cp $J "$c"; done
