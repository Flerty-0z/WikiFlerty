name: Probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Logins
        env:
          KEY: ${{ secrets.SELECTEL_S3_ACCESS }}
          SECRET: ${{ secrets.SELECTEL_S3_SECRET }}
        run: |
          base=https://wikiflerty-books.s3.ru-3.storage.selcloud.ru
          for l in flerty0z f1erty0z; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -I --max-time 30 --aws-sigv4 "aws:amz:ru-3:s3" --user "$KEY:$SECRET" -H "x-amz-content-sha256: UNSIGNED-PAYLOAD" "$base/users/$l.json")
            echo "$l $code"
          done
