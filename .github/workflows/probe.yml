name: Probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Site and API
        run: |
          for u in https://wikiflerty.ru/ https://wikiflerty.ru/download https://wikiflerty.ru/account https://wikiflerty.ru/offer https://wikiflerty.ru/privacy https://wikiflerty.ru/fx.js https://wikiflerty.ru/style.css https://sync.wikiflerty.ru/; do
            echo "$u $(curl -s -o /dev/null -w '%{http_code} %{size_download}' --max-time 30 -L "$u")"
          done
          echo "me $(curl -s --max-time 30 -X POST https://sync.wikiflerty.ru/v1/me -d '{}')"
          echo "pay $(curl -s --max-time 30 -X POST https://sync.wikiflerty.ru/v1/pay/create -H 'Authorization: Bearer x' -d '{"plan":"plus"}')"
          curl -s --max-time 30 https://wikiflerty.ru/style.css | grep -o "overflow-y:hidden;touch-action:pan-x pan-y" | head -1
          curl -s --max-time 30 https://wikiflerty.ru/account | grep -o 'class="lk"' | head -1
          curl -s --max-time 30 -L https://wikiflerty.ru/download | grep -oE "WikiFlerty-0\.1\.[0-9]+\.apk|0\.1\.[0-9]+" | sort -u | head -5
