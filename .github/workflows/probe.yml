name: Probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Usage
        env:
          KEY: ${{ secrets.SELECTEL_S3_ACCESS }}
          SECRET: ${{ secrets.SELECTEL_S3_SECRET }}
        run: |
          base=https://wikiflerty-books.s3.ru-3.storage.selcloud.ru
          s3() { curl -sS --fail --max-time 30 --aws-sigv4 "aws:amz:ru-3:s3" --user "$KEY:$SECRET" -H "x-amz-content-sha256: UNSIGNED-PAYLOAD" "$@"; }
          mkdir u
          for k in $(s3 "$base/?list-type=2&prefix=users/&max-keys=1000" | grep -o '<Key>[^<]*' | sed 's/<Key>//'); do s3 "$base/$k" > "u/$(basename $k)" || true; done
          python3 - <<'PY'
          import glob, json, time
          now = time.time() * 1000
          n = over = paid = 0
          for f in glob.glob("u/*.json"):
              try: u = json.load(open(f))
              except Exception: continue
              n += 1
              used = sum((b or {}).get("size", 0) for b in (u.get("books") or {}).values())
              active = (u.get("until") or 0) > now
              paid += active
              if used > 500 * 1024 * 1024 and not active: over += 1
          print("users", n, "paid", paid, "over500free", over)
          PY
