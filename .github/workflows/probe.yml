name: Probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download links
        run: |
          curl -s --max-time 30 https://wikiflerty.ru/download/info; echo
          for a in x64 x32; do curl -s -D - -o /tmp/$a.apk --max-time 180 https://wikiflerty.ru/download/$a | grep -iE "^HTTP|content-disposition|content-length"; sha256sum /tmp/$a.apk; done
          for a in x64 x32; do curl -sL -o /tmp/g$a.apk "https://github.com/Flerty-0z/WikiFlerty/releases/download/v0.1.273/WikiFlerty-0.1.273-$a.apk"; sha256sum /tmp/g$a.apk; done
