name: Probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Sizes
        run: |
          for u in \
            https://alphacephei.com/vosk/models/vosk-model-tts-ru-0.9-multi.zip \
            https://alphacephei.com/vosk/models/vosk-model-tts-ru-0.8-multi.zip \
            https://alphacephei.com/vosk/models/vosk-model-tts-ru-0.7-multi.zip \
            https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip \
            https://huggingface.co/da1353/kokoro-ru/resolve/main/onnx/model_quantized.onnx \
            https://huggingface.co/da1353/kokoro-ru/resolve/main/onnx/model_dima_quantized.onnx \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-t-one-russian-2025-09-08.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-nemo-ctc-giga-am-v2-russian-2025-04-19.tar.bz2 \
            ; do
            s=$(curl -sIL "$u" | grep -i '^content-length' | tail -1 | tr -d '\r' | awk '{print $2}')
            echo "$u $((s/1048576)) MB"
          done
      - name: Vosk contents
        run: |
          curl -sL -o v.zip https://alphacephei.com/vosk/models/vosk-model-tts-ru-0.9-multi.zip || true
          unzip -l v.zip | sort -k1 -n | tail -25 || true
      - name: Kokoro repo files
        run: |
          curl -s https://huggingface.co/api/models/da1353/kokoro-ru/tree/main/onnx | python3 -c "import json,sys;[print(f['path'],f.get('size',0)//1048576,'MB') for f in json.load(sys.stdin)]" || true
          curl -s https://huggingface.co/api/models/da1353/kokoro-ru/tree/main | python3 -c "import json,sys;[print(f['path'],f.get('size',0)//1024,'KB') for f in json.load(sys.stdin)]" || true
